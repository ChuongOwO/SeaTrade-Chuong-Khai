name: CI

on:
  push:
    branches: [main, duy-khai, chuong]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Web: build thử để bắt lỗi import/cú pháp trước khi deploy
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Back-end chưa có test tự động: kiểm tra cú pháp toàn bộ file .js
  back-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: back-end/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra cú pháp
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

  # Chạy thử toàn bộ migration (V1..V5) trên Postgres tạm.
  # Dùng image Flyway chính thức thay cho scripts/flyway.js (wrapper đó
  # chỉ tự giải nén được bản Windows, không chạy được trên Linux runner).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # V1 cần extension postgis, image postgres thuần không có
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seafood_trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Flyway migrate
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/back-end/migrations:/flyway/sql:ro" \
            flyway/flyway:10.22.0 \
            -url=jdbc:postgresql://localhost:5432/seafood_trading \
            -user=postgres -password=postgres \
            -schemas=public -baselineOnMigrate=true \
            migrate

  # ai-service: không có test pytest (tests/test_inference.py là script chạy tay
  # cần bộ ảnh nằm ngoài git) nên chỉ kiểm tra: cài được thư viện, code biên dịch
  # được, import được app, và file model đã được commit.
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Thư viện hệ thống cho OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Cài PyTorch bản CPU (nhẹ hơn nhiều so với bản CUDA mặc định)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Biên dịch toàn bộ code
        run: python -m compileall -q app main.py
      - name: Import FastAPI app
        run: python -c "import main; print('import main OK')"
      - name: File model đã nằm trong git
        run: test -f ml-models/seafood_model.pt

  # Kiểm tra bundle app đóng gói được (không chặn nếu lỗi)
  mobile:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx expo export --platform android
